name: Run Basic Tests

on:
    pull_request:
        branches: [main]

jobs:
    cypress-run:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout do projeto
              uses: actions/checkout@v7

            - name: Install project dependencies
              run: npm install
            
            - name: Run tests
              uses: cypress-io/github-action@v7
              with:
                record: true
              env:
                CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}